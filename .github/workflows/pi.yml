name: Build pi Docker image

on:
  push:
    paths:
      - "pi/**"
      - ".github/workflows/pi.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ./pi
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/pi:latest
            ghcr.io/${{ github.repository }}/pi:${{ steps.vars.outputs.sha_short }}
